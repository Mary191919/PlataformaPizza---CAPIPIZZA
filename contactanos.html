<body>
  <div class="contenedor-contacto">
    <div class="cabecera-contacto">
      <h2>CONTÁCTANOS</h2>
      <div class="separador"></div>
    </div>
    <div class="detalles-contacto">
      <div>
        <address>
          <span>Avenida Aviación 567, San Borja, Lima, Perú</span>
          <span><span class="icono">&#9742;</span> +51-987654321</span>
          <span><span class="icono">&#9993;</span> contacto@donlucianopizzeria.com</span>
          <span><span class="icono">&#128337;</span> LUN-DOM 12:00PM a 11:00PM</span>
        </address>
      </div>
      <form class="formulario-contacto">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="tel" name="telefono" placeholder="Teléfono" required>
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <textarea name="mensaje" placeholder="Mensaje" rows="4" required></textarea>
        <button type="submit">ENVIAR MENSAJE</button>
      </form>
    </div>
    <div class="contenedor-mapa">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3901.2047745382756!2d-77.00132838561615!3d-12.107557791430796!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c868f278cc11%3A0x7b7b26774eae7da8!2sAv.%20Aviaci%C3%B3n%20567%2C%20San%20Borja%2015021%2C%20Per%C3%BA!5e0!3m2!1ses!2spe!4v1702382048536!5m2!1ses!2spe"
